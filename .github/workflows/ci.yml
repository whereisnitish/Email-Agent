name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check --output-format=github .

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          coverage run -m unittest discover -s tests
          coverage report

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      # Installed from the wheel, outside the checkout: proves the bundled
      # demo data and both console scripts ship correctly.
      - name: Console script runs from an installed wheel
        working-directory: /tmp
        run: |
          email-intent --demo --format table
          email-intent --demo --id msg_1001 | tee /tmp/out.json
          email-intent --schema > /dev/null
          email-intent-server --help > /dev/null
      - name: Output matches the documented contract
        working-directory: /tmp
        run: |
          python - <<'PY'
          import json
          data = json.load(open("/tmp/out.json"))
          assert set(data) == {
              "customer_intent", "summary", "products",
              "customer_preferences", "missing_information", "confidence",
          }, data.keys()
          product = data["products"][0]
          assert data["customer_intent"] == "product_request", data["customer_intent"]
          assert product["product_type"] == "tumbler", product
          assert product["quantity"] == 150, product
          assert product["delivery_deadline"] == "2026-10-20", product
          assert product["budget_per_unit"] == 15, product
          print("contract OK")
          PY

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
